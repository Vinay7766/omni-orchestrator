[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: editing another tool's JSON config must keep the user's key order (D5).
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
# BYOK API keys live in the OS credential store, never in settings.json (NFR-10). Default
# features ("v1") pick Windows Credential Manager, macOS Keychain, or the Secret Service on
# Linux. MIT OR Apache-2.0. https://docs.rs/keyring/4.2.0/keyring/v1/index.html
keyring = "4.2.0"
tauri-plugin-dialog = "2"


[dev-dependencies]
# Validates the shared /schemas fixtures in tests. Pinned; default features (HTTP/file
# ref resolution, TLS) disabled: schemas are registered locally by urn id.
jsonschema = { version = "=0.58.6", default-features = false }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
